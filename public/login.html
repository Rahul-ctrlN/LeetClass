<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LeetClass — Sign in</title>
    <link rel="stylesheet" href="/styles.css">
</head>

<body class="login-page">

<main class="login-card">

    <a class="brand login-brand" href="/">
        <span class="brand-mark">
            <img
                src="https://leetcode.com/favicon.ico"
                alt="LeetCode logo"
            >
        </span>

        <span>
            Leet<span>Class</span>
            <small>Your coding classroom</small>
        </span>
    </a>

    <p class="eyebrow">WELCOME TO LEETCLASS</p>

    <h1 id="loginTitle">
        Track progress.<br>
        Grow together.
    </h1>

    <p class="login-copy" id="loginCopy">
        Sign in to access your coding classroom.
    </p>


    <!-- LOGIN FORM -->

    <form id="loginForm" class="auth-form">

        <label for="loginEmail">
            Email
        </label>

        <input
            id="loginEmail"
            type="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
        >

        <label for="loginPassword">
            Password
        </label>

        <input
            id="loginPassword"
            type="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
        >

        <button
            type="submit"
            class="login-button"
        >
            Sign in
        </button>

    </form>


    <!-- REGISTER FORM -->

    <form
        id="registerForm"
        class="auth-form"
        style="display: none;"
    >

        <label for="registerName">
            Name
        </label>

        <input
            id="registerName"
            type="text"
            placeholder="Enter your name"
            autocomplete="name"
            required
        >

        <label for="registerEmail">
            Email
        </label>

        <input
            id="registerEmail"
            type="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
        >

        <label for="registerPassword">
            Password
        </label>

        <input
            id="registerPassword"
            type="password"
            placeholder="At least 6 characters"
            autocomplete="new-password"
            minlength="6"
            required
        >

        <label for="registerConfirmPassword">
            Confirm password
        </label>

        <input
            id="registerConfirmPassword"
            type="password"
            placeholder="Confirm your password"
            autocomplete="new-password"
            minlength="6"
            required
        >

        <button
            type="submit"
            class="login-button"
        >
            Create account
        </button>

    </form>


    <!-- MESSAGE -->

    <p
        class="login-note"
        id="loginNote"
    >
        Your classroom is private to your account.
    </p>


    <!-- SWITCH LOGIN / REGISTER -->

    <div class="auth-switch">

        <span id="switchText">
            Don't have an account?
        </span>

        <button
            type="button"
            id="switchAuth"
            class="auth-switch-button"
        >
            Create account
        </button>

    </div>

</main>


<!-- ONLY ONE SCRIPT -->

<script src="/login.js"></script>

</body>
</html>
