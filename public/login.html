<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>LeetClass — Sign in</title>
    <link rel="stylesheet" href="/styles.css">
</head>

<body class="login-page">

<main class="login-card">

    <a class="brand login-brand" href="/">
        <span class="brand-mark">
            <img
                src="https://leetcode.com/favicon.ico"
                alt="LeetCode logo"
            >
        </span>

        <span>
            Leet<span>Class</span>
            <small>Your coding classroom</small>
        </span>
    </a>

    <p class="eyebrow">WELCOME TO LEETCLASS</p>

    <h1 id="loginTitle">
        Track progress.<br>
        Grow together.
    </h1>

    <p class="login-copy" id="loginCopy">
        Sign in to access your coding classroom.
    </p>


    <!-- ================= LOGIN ================= -->

    <form id="loginForm" class="auth-form">

        <label for="loginEmail">
            Email
        </label>

        <input
            id="loginEmail"
            type="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
        >


        <label for="loginPassword">
            Password
        </label>

        <input
            id="loginPassword"
            type="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
        >


        <button type="submit" class="login-button">
            Sign in
        </button>

    </form>


    <!-- ================= REGISTER ================= -->

    <form id="registerForm" class="auth-form" style="display:none;">

        <label for="registerName">
            Name
        </label>

        <input
            id="registerName"
            type="text"
            placeholder="Enter your name"
            autocomplete="name"
            required
        >


        <label for="registerEmail">
            Email
        </label>

        <input
            id="registerEmail"
            type="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
        >


        <label for="registerPassword">
            Password
        </label>

        <input
            id="registerPassword"
            type="password"
            placeholder="At least 6 characters"
            autocomplete="new-password"
            minlength="6"
            required
        >


        <label for="registerConfirmPassword">
            Confirm password
        </label>

        <input
            id="registerConfirmPassword"
            type="password"
            placeholder="Confirm your password"
            autocomplete="new-password"
            minlength="6"
            required
        >


        <button type="submit" class="login-button">
            Create account
        </button>

    </form>


    <p
        class="login-note"
        id="loginNote"
    >
        Your classroom is private to your account.
    </p>


    <div class="auth-switch">

        <span id="switchText">
            Don't have an account?
        </span>

        <button
            type="button"
            id="switchAuth"
            class="auth-switch-button"
        >
            Create account
        </button>

    </div>

</main>

<script src="/login.js"></script>

<script>
    const loginForm = document.querySelector('#loginForm');
    const registerForm = document.querySelector('#registerForm');
    const switchAuth = document.querySelector('#switchAuth');
    const switchText = document.querySelector('#switchText');

    const loginTitle = document.querySelector('#loginTitle');
    const loginCopy = document.querySelector('#loginCopy');

    let registerMode = false;

    switchAuth.addEventListener('click', () => {

        registerMode = !registerMode;

        if (registerMode) {

            loginForm.style.display = 'none';
            registerForm.style.display = 'flex';

            loginTitle.innerHTML =
                'Create your<br>account.';

            loginCopy.textContent =
                'Create an account to start your coding classroom.';

            switchText.textContent =
                'Already have an account?';

            switchAuth.textContent =
                'Sign in';

        } else {

            loginForm.style.display = 'flex';
            registerForm.style.display = 'none';

            loginTitle.innerHTML =
                'Track progress.<br>Grow together.';

            loginCopy.textContent =
                'Sign in to access your coding classroom.';

            switchText.textContent =
                "Don't have an account?";

            switchAuth.textContent =
                'Create account';
        }

        const note = document.querySelector('#loginNote');

        if (note) {
            note.textContent =
                'Your classroom is private to your account.';
            note.style.color = '';
        }
    });
</script>

</body>
</html>
